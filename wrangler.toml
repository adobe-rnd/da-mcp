name = "da-mcp"
main = "src/index.ts"
compatibility_date = "2025-11-17"
compatibility_flags = ["nodejs_compat"]

services = [
  { binding = "daadmin", service = "da-admin-dev" }
]

[vars]
VERSION = "@@VERSION@@-dev"
ENVIRONMENT = "dev"

# CI environment
[env.ci]
name = "da-mcp-ci"
services = [
  { binding = "daadmin", service = "da-admin-stage" }
]

[env.ci.vars]
VERSION = "@@VERSION@@-ci"
ENVIRONMENT = "ci"

# Production environment
[env.production]
name = "da-mcp"
services = [
  { binding = "daadmin", service = "da-admin" }
]

[env.production.vars]
VERSION = "@@VERSION@@"
ENVIRONMENT = "production"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true