name = "mcp-da-admin"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
VERSION = "@@VERSION@@-dev"
ENVIRONMENT = "dev"
DA_ADMIN_BASE_URL = "https://admin.da.live"

# CI environment
[env.ci]
name = "mcp-da-admin-ci"
[env.ci.vars]
VERSION = "@@VERSION@@-ci"
ENVIRONMENT = "ci"
DA_ADMIN_BASE_URL = "https://admin.da.live"

# Production environment
[env.production]
name = "mcp-da-admin"
[env.production.vars]
VERSION = "@@VERSION@@"
ENVIRONMENT = "production"
DA_ADMIN_BASE_URL = "https://admin.da.live"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true